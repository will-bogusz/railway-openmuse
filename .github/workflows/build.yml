name: build

# Builds both OpenMuse images from one pinned upstream commit:
#   ghcr.io/<owner>/openmuse                 this repo's Dockerfile (API + web client + Caddy)
#   ghcr.io/<owner>/openmuse-browser-worker  upstream apps/worker/Dockerfile, unchanged
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag (default <upstream short sha>-YYYYMMDD)
        required: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          commit=$(sed -n 's/^ARG OPENMUSE_COMMIT=//p' Dockerfile)
          tag="${{ github.event.inputs.tag }}"
          [ -n "$tag" ] || tag="${commit:0:7}-$(date -u +%Y%m%d)"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Upstream source at the pinned commit
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/CopilotKit/OpenMuse.git upstream
          git -C upstream checkout --quiet "${{ steps.meta.outputs.commit }}"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: app
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ghcr.io/${{ github.repository_owner }}/openmuse:${{ steps.meta.outputs.tag }}
      - uses: docker/build-push-action@v6
        id: worker
        with:
          context: upstream/apps/worker
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ghcr.io/${{ github.repository_owner }}/openmuse-browser-worker:${{ steps.meta.outputs.tag }}
      - run: |
          {
            echo "ghcr.io/${{ github.repository_owner }}/openmuse:${{ steps.meta.outputs.tag }}@${{ steps.app.outputs.digest }}"
            echo "ghcr.io/${{ github.repository_owner }}/openmuse-browser-worker:${{ steps.meta.outputs.tag }}@${{ steps.worker.outputs.digest }}"
          } | tee -a "$GITHUB_STEP_SUMMARY"
